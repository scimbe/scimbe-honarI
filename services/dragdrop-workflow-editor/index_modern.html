<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Temporal Workflow Editor - Modern</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- React and React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX (load before Monaco to avoid conflicts) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Monaco Editor (load separately to avoid AMD conflicts) -->
    <script>
        // Clear AMD define to avoid conflicts
        if (typeof define !== 'undefined') {
            window.monacoAmdDefine = define;
            delete window.define;
        }
    </script>
    <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
        // Restore define after Monaco loads
        if (typeof window.monacoAmdDefine !== 'undefined') {
            window.define = window.monacoAmdDefine;
            delete window.monacoAmdDefine;
        }
    </script>
    
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d30;
            --bg-tertiary: #252526;
            --bg-hover: #37373d;
            --bg-active: #094771;
            --text-primary: #cccccc;
            --text-secondary: #969696;
            --text-muted: #6c757d;
            --border-color: #3e3e42;
            --accent-color: #007acc;
            --accent-hover: #1177bb;
            --success-color: #4ec9b0;
            --warning-color: #ffcc02;
            --error-color: #f44747;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        
        .editor-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .editor-header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px var(--shadow);
            position: relative;
        }
        
        .editor-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-color) 50%, transparent 100%);
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-title i {
            color: var(--accent-color);
            font-size: 20px;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .editor-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .activity-explorer {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .activity-explorer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-color) 0%, transparent 50%, var(--accent-color) 100%);
            opacity: 0.3;
        }
        
        .activity-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-tertiary);
        }
        
        .activity-header h3 {
            margin: 0 0 16px 0;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-container {
            position: relative;
            margin-bottom: 16px;
        }
        
        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            transition: all 0.2s ease;
        }
        
        .search-container input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.2);
        }
        
        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .filter-container select {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
        }
        
        .activity-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .activity-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .activity-list::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        .activity-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .activity-item {
            padding: 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .activity-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--bg-hover) 0%, var(--bg-tertiary) 100%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .activity-item:hover::before {
            opacity: 1;
        }
        
        .activity-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--shadow);
        }
        
        .activity-item.selected {
            background: linear-gradient(135deg, var(--bg-active) 0%, #0074cc 100%);
            border-color: var(--accent-color);
            box-shadow: 0 4px 16px rgba(0, 122, 204, 0.3);
        }
        
        .activity-item.selected::before {
            display: none;
        }
        
        .activity-content {
            position: relative;
            z-index: 1;
        }
        
        .activity-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .activity-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
        }
        
        .activity-text h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
        }
        
        .activity-text p {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .activity-arrow {
            color: var(--text-muted);
            font-size: 12px;
            opacity: 0;
            transition: all 0.2s ease;
        }
        
        .activity-item:hover .activity-arrow {
            opacity: 1;
            transform: translateX(4px);
        }
        
        .editor-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .editor-tabs {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            padding: 0 20px;
            position: relative;
        }
        
        .editor-tabs::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-color) 30%, var(--accent-color) 70%, transparent 100%);
            opacity: 0.5;
        }
        
        .editor-tab {
            padding: 16px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
        }
        
        .editor-tab:hover {
            color: var(--text-primary);
        }
        
        .editor-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
            background: var(--bg-primary);
        }
        
        .tab-close {
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: 4px;
            padding: 2px;
            cursor: pointer;
        }
        
        .editor-tab:hover .tab-close {
            opacity: 1;
        }
        
        .tab-close:hover {
            background: var(--error-color);
            color: white;
        }
        
        .editor-content {
            flex: 1;
            position: relative;
        }
        
        .monaco-editor-wrapper {
            height: 100%;
            width: 100%;
        }
        
        .editor-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--text-secondary);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
        }
        
        .status-bar {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .btn {
            padding: 12px 20px;
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 204, 0.3);
        }
        
        .btn.warning {
            background: var(--warning-color);
            border-color: var(--warning-color);
            color: var(--bg-primary);
        }
        
        .btn.danger {
            background: var(--error-color);
            border-color: var(--error-color);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            animation: slideInRight 0.3s ease;
            max-width: 400px;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .notification.success {
            border-left: 4px solid var(--success-color);
        }
        
        .notification.warning {
            border-left: 4px solid var(--warning-color);
        }
        
        .notification.error {
            border-left: 4px solid var(--error-color);
        }
    </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    
    // Monaco Editor setup
    let monacoPromise = null;
    const getMonaco = () => {
        if (!monacoPromise) {
            monacoPromise = new Promise((resolve) => {
                require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });
                require(['vs/editor/editor.main'], () => {
                    resolve(window.monaco);
                });
            });
        }
        return monacoPromise;
    };

    // Modern Activity Explorer with improved design
    const ActivityExplorer = ({ activities, onActivitySelect, selectedActivity }) => {
        const [searchTerm, setSearchTerm] = useState('');
        const [categoryFilter, setCategoryFilter] = useState('all');
        
        const filteredActivities = activities.filter(activity => {
            const matchesSearch = activity.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                (activity.description && activity.description.toLowerCase().includes(searchTerm.toLowerCase()));
            const matchesCategory = categoryFilter === 'all' || activity.category === categoryFilter;
            return matchesSearch && matchesCategory;
        });
        
        const categories = ['all', ...new Set(activities.map(a => a.category).filter(Boolean))];
        
        const getActivityIcon = (category) => {
            const icons = {
                'Communication': 'fa-envelope',
                'Finance': 'fa-credit-card',
                'Data': 'fa-database',
                'Integration': 'fa-plug',
                'Reports': 'fa-chart-bar',
                'Database': 'fa-server'
            };
            return icons[category] || 'fa-cog';
        };
        
        return (
            <div className="activity-explorer">
                <div className="activity-header">
                    <h3>
                        <i className="fas fa-puzzle-piece"></i>
                        Activities ({activities.length})
                    </h3>
                    
                    <div className="search-container">
                        <input
                            type="text"
                            placeholder="Search activities..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <i className="fas fa-search"></i>
                    </div>
                    
                    <div className="filter-container">
                        <select
                            value={categoryFilter}
                            onChange={(e) => setCategoryFilter(e.target.value)}
                        >
                            {categories.map(category => (
                                <option key={category} value={category}>
                                    {category === 'all' ? 'All Categories' : category}
                                </option>
                            ))}
                        </select>
                    </div>
                </div>
                
                <div className="activity-list">
                    {filteredActivities.length > 0 ? (
                        filteredActivities.map(activity => (
                            <div 
                                key={activity.id}
                                className={`activity-item ${selectedActivity?.id === activity.id ? 'selected' : ''}`}
                                onClick={() => onActivitySelect(activity)}
                            >
                                <div className="activity-content">
                                    <div className="activity-info">
                                        <div className="activity-details">
                                            <div className="activity-icon">
                                                <i className={`fas ${getActivityIcon(activity.category)}`}></i>
                                            </div>
                                            <div className="activity-text">
                                                <h4>{activity.name}</h4>
                                                <p>{activity.category}</p>
                                            </div>
                                        </div>
                                        <i className="fas fa-chevron-right activity-arrow"></i>
                                    </div>
                                </div>
                            </div>
                        ))
                    ) : (
                        <div className="empty-state">
                            <i className="fas fa-search"></i>
                            <p>No activities found</p>
                            {searchTerm && (
                                <button 
                                    onClick={() => setSearchTerm('')}
                                    className="btn"
                                >
                                    Clear search
                                </button>
                            )}
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // Confirmation Modal Component
    const ConfirmationModal = ({ isOpen, onClose, onConfirm, title, message, type = 'warning' }) => {
        if (!isOpen) return null;
        
        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                    <div className="modal-header">
                        <i className={`fas ${type === 'warning' ? 'fa-exclamation-triangle' : 'fa-question-circle'}`}></i>
                        <h3>{title}</h3>
                    </div>
                    <div className="modal-body">
                        <p>{message}</p>
                    </div>
                    <div className="modal-footer">
                        <button className="btn" onClick={onClose}>
                            Cancel
                        </button>
                        <button className={`btn ${type}`} onClick={onConfirm}>
                            {type === 'warning' ? 'Discard Changes' : 'Confirm'}
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // Notification Component
    const Notification = ({ notification, onClose }) => {
        useEffect(() => {
            if (notification) {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }
        }, [notification, onClose]);
        
        if (!notification) return null;
        
        return (
            <div className={`notification ${notification.type}`}>
                <p>{notification.message}</p>
            </div>
        );
    };

    // Monaco Editor Component
    const MonacoEditor = ({ value, language, onChange, theme = 'vs-dark' }) => {
        const editorRef = useRef(null);
        const containerRef = useRef(null);
        
        useEffect(() => {
            let editor = null;
            
            getMonaco().then((monaco) => {
                if (containerRef.current) {
                    editor = monaco.editor.create(containerRef.current, {
                        value: value || '',
                        language: language || 'javascript',
                        theme: theme,
                        automaticLayout: true,
                        minimap: { enabled: true },
                        lineNumbers: 'on',
                        roundedSelection: false,
                        scrollBeyondLastLine: false,
                        fontSize: 14,
                        fontFamily: 'Consolas, Monaco, "Courier New", monospace'
                    });
                    
                    editorRef.current = editor;
                    
                    editor.onDidChangeModelContent(() => {
                        const newValue = editor.getValue();
                        if (onChange) {
                            onChange(newValue);
                        }
                    });
                }
            });
            
            return () => {
                if (editor) {
                    editor.dispose();
                }
            };
        }, []);
        
        useEffect(() => {
            if (editorRef.current && value !== editorRef.current.getValue()) {
                editorRef.current.setValue(value || '');
            }
        }, [value]);
        
        useEffect(() => {
            if (editorRef.current) {
                const model = editorRef.current.getModel();
                if (model) {
                    window.monaco.editor.setModelLanguage(model, language || 'javascript');
                }
            }
        }, [language]);
        
        return <div ref={containerRef} className="monaco-editor-wrapper" />;
    };

    // Editor Tab Component
    const EditorTab = ({ tab, isActive, onSelect, onClose }) => (
        <div
            className={`editor-tab ${isActive ? 'active' : ''}`}
            onClick={onSelect}
        >
            <i className={`fas ${getTabIcon(tab.type)}`}></i>
            <span>{tab.title}</span>
            <i 
                className="fas fa-times tab-close"
                onClick={(e) => {
                    e.stopPropagation();
                    onClose();
                }}
            ></i>
        </div>
    );

    const getTabIcon = (type) => {
        const icons = {
            'code': 'fa-code',
            'schema': 'fa-cog',
            'test': 'fa-vial'
        };
        return icons[type] || 'fa-file';
    };

    // Main Enhanced Workflow Editor Component
    const EnhancedWorkflowEditor = () => {
        const [activities, setActivities] = useState([]);
        const [selectedActivity, setSelectedActivity] = useState(null);
        const [openTabs, setOpenTabs] = useState([]);
        const [activeTabId, setActiveTabId] = useState(null);
        const [editorContent, setEditorContent] = useState({});
        const [loading, setLoading] = useState(true);
        const [isDirty, setIsDirty] = useState(false);
        const [modalOpen, setModalOpen] = useState(false);
        const [pendingActivity, setPendingActivity] = useState(null);
        const [notification, setNotification] = useState(null);
        const [sessionId] = useState(() => 'session-' + Date.now());

        // Load activities on mount
        useEffect(() => {
            loadActivities();
        }, []);

        const loadActivities = async () => {
            try {
                const response = await fetch('/api/activities');
                const data = await response.json();
                setActivities(data.activities || []);
                setLoading(false);
            } catch (error) {
                console.error('Error loading activities, using sample data:', error);
                // Use sample activities when API is not available
                setActivities([
                    { id: 'send-email', name: 'Send Email', type: 'Communication', description: 'Send email notifications', category: 'Communication' },
                    { id: 'process-payment', name: 'Process Payment', type: 'Finance', description: 'Process payments', category: 'Finance' },
                    { id: 'validate-data', name: 'Validate Data', type: 'Data', description: 'Validate input data', category: 'Data' },
                    { id: 'call-api', name: 'Call External API', type: 'Integration', description: 'Make HTTP requests', category: 'Integration' },
                    { id: 'generate-report', name: 'Generate Report', type: 'Reports', description: 'Create PDF reports', category: 'Reports' },
                    { id: 'save-database', name: 'Save to Database', type: 'Database', description: 'Store data in database', category: 'Database' }
                ]);
                setLoading(false);
            }
        };

        const showNotification = (message, type = 'success') => {
            setNotification({ message, type });
        };

        const closeNotification = () => {
            setNotification(null);
        };

        const checkUnsavedChanges = () => {
            return isDirty;
        };

        // CRITICAL: Activity isolation - only one activity at a time
        const onActivitySelect = async (activity) => {
            if (selectedActivity && selectedActivity.id !== activity.id) {
                if (checkUnsavedChanges()) {
                    setPendingActivity(activity);
                    setModalOpen(true);
                    return;
                }
                
                // Close all tabs from previous activity
                setOpenTabs([]);
                setActiveTabId(null);
                setEditorContent({});
                setIsDirty(false);
            }
            
            setSelectedActivity(activity);
            
            // Load tabs for this activity only
            const newTabs = [
                { id: `${activity.id}-code`, title: 'Code', type: 'code', activityId: activity.id },
                { id: `${activity.id}-schema`, title: 'Schema', type: 'schema', activityId: activity.id },
                { id: `${activity.id}-test`, title: 'Tests', type: 'test', activityId: activity.id }
            ];
            
            setOpenTabs(newTabs);
            setActiveTabId(newTabs[0].id);
            
            // Load content for all tabs
            for (const tab of newTabs) {
                await loadTabContent(activity.id, tab.type);
            }
            
            showNotification(`Loaded activity: ${activity.name}`);
        };

        const loadTabContent = async (activityId, type) => {
            const tabId = `${activityId}-${type}`;
            let content = getDefaultContent(activityId, type);
            
            try {
                const response = await fetch(`/api/editor/activities/${activityId}/${type}`);
                if (response.ok) {
                    const data = await response.json();
                    switch (type) {
                        case 'code':
                            content = data.code_content || content;
                            break;
                        case 'schema':
                            content = JSON.stringify(data, null, 2);
                            break;
                        case 'test':
                            content = Array.isArray(data) ? 
                                data.map(test => test.test_code || '').join('\n\n') : content;
                            break;
                    }
                }
            } catch (error) {
                console.log(`Using default content for ${type}`);
            }
            
            setEditorContent(prev => ({
                ...prev,
                [tabId]: content
            }));
        };

        const getDefaultContent = (activityId, type) => {
            const activityName = activityId.split('-').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join('');
            
            switch (type) {
                case 'code':
                    return `// ${activityName} Activity Implementation
async function ${activityId.replace(/-/g, '_')}(context, input) {
    console.log('Starting ${activityName} activity');
    console.log('Input:', input);
    
    try {
        // TODO: Implement your ${activityName.toLowerCase()} logic here
        const result = {
            success: true,
            message: '${activityName} completed successfully',
            timestamp: new Date().toISOString(),
            data: input
        };
        
        return result;
    } catch (error) {
        console.error('Error in ${activityName}:', error);
        throw error;
    }
}

module.exports = ${activityId.replace(/-/g, '_')};`;

                case 'schema':
                    return JSON.stringify({
                        "$schema": "http://json-schema.org/draft-07/schema#",
                        "type": "object",
                        "title": `${activityName} Schema`,
                        "properties": {
                            "input": {
                                "type": "object",
                                "properties": {
                                    "data": { "type": "string", "description": "Input data" }
                                },
                                "required": ["data"]
                            }
                        }
                    }, null, 2);

                case 'test':
                    return `// Test Cases for ${activityName} Activity
const { expect } = require('chai');
const ${activityId.replace(/-/g, '_')} = require('./${activityId}');

describe('${activityName} Activity Tests', () => {
    it('should execute successfully with valid input', async () => {
        const input = { data: 'test data' };
        const result = await ${activityId.replace(/-/g, '_')}({}, input);
        
        expect(result).to.be.an('object');
        expect(result.success).to.be.true;
    });
});`;

                default:
                    return `// Default content for ${type}`;
            }
        };

        const onTabSelect = (tabId) => {
            setActiveTabId(tabId);
        };

        const onTabClose = (tabId) => {
            if (checkUnsavedChanges()) {
                showNotification('Please save your changes before closing tabs', 'warning');
                return;
            }
            
            setOpenTabs(prev => prev.filter(tab => tab.id !== tabId));
            if (activeTabId === tabId) {
                const remainingTabs = openTabs.filter(tab => tab.id !== tabId);
                setActiveTabId(remainingTabs.length > 0 ? remainingTabs[0].id : null);
            }
        };

        const onEditorChange = (tabId, value) => {
            setEditorContent(prev => ({
                ...prev,
                [tabId]: value
            }));
            setIsDirty(true);
        };

        const saveCurrentTab = async () => {
            if (!activeTabId || !selectedActivity) return;
            
            try {
                // Simulate save operation
                await new Promise(resolve => setTimeout(resolve, 500));
                setIsDirty(false);
                showNotification('Changes saved successfully');
            } catch (error) {
                showNotification('Error saving changes', 'error');
            }
        };

        const runTests = () => {
            showNotification('Running tests...', 'success');
            // Simulate test execution
        };

        const handleModalConfirm = () => {
            setIsDirty(false);
            setModalOpen(false);
            if (pendingActivity) {
                onActivitySelect(pendingActivity);
                setPendingActivity(null);
            }
        };

        const handleModalClose = () => {
            setModalOpen(false);
            setPendingActivity(null);
        };

        const getLanguage = (tab) => {
            if (!tab) return 'javascript';
            switch (tab.type) {
                case 'code': return 'javascript';
                case 'schema': return 'json';
                case 'test': return 'javascript';
                default: return 'javascript';
            }
        };

        const activeTab = openTabs.find(tab => tab.id === activeTabId);
        const currentContent = activeTabId ? editorContent[activeTabId] || '' : '';

        if (loading) {
            return (
                <div className="editor-container">
                    <div className="editor-loading">
                        <i className="fas fa-spinner fa-spin" style={{fontSize: '32px'}}></i>
                        <p>Loading Enhanced Editor...</p>
                    </div>
                </div>
            );
        }

        return (
            <div className="editor-container">
                <div className="editor-header">
                    <div className="header-title">
                        <i className="fas fa-code"></i>
                        Enhanced Temporal Workflow Editor
                    </div>
                    <div className="header-actions">
                        <button className="btn" onClick={saveCurrentTab} disabled={!isDirty}>
                            <i className="fas fa-save"></i>
                            Save (Ctrl+S)
                        </button>
                        <button className="btn" onClick={runTests}>
                            <i className="fas fa-play"></i>
                            Run Tests
                        </button>
                    </div>
                </div>
                
                <div className="editor-body">
                    <ActivityExplorer 
                        activities={activities}
                        onActivitySelect={onActivitySelect}
                        selectedActivity={selectedActivity}
                    />
                    
                    <div className="editor-main">
                        <div className="editor-tabs">
                            {openTabs.map(tab => (
                                <EditorTab
                                    key={tab.id}
                                    tab={tab}
                                    isActive={tab.id === activeTabId}
                                    onSelect={() => onTabSelect(tab.id)}
                                    onClose={() => onTabClose(tab.id)}
                                />
                            ))}
                        </div>
                        
                        <div className="editor-content">
                            {activeTab ? (
                                <MonacoEditor
                                    value={currentContent}
                                    language={getLanguage(activeTab)}
                                    onChange={(value) => onEditorChange(activeTabId, value)}
                                    theme="vs-dark"
                                />
                            ) : (
                                <div className="empty-state">
                                    <i className="fas fa-folder-open"></i>
                                    <p>Select an activity to start editing</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
                
                <div className="status-bar">
                    <div>
                        {activeTab ? `${activeTab.title} - ${getLanguage(activeTab)}` : 'No file selected'}
                        {isDirty && <span style={{color: 'var(--warning-color)'}}> • Modified</span>}
                    </div>
                    <div>
                        {selectedActivity ? `Activity: ${selectedActivity.name}` : 'No activity selected'} | 
                        Session: {sessionId.slice(-8)}
                    </div>
                </div>

                <ConfirmationModal
                    isOpen={modalOpen}
                    onClose={handleModalClose}
                    onConfirm={handleModalConfirm}
                    title="Unsaved Changes"
                    message="You have unsaved changes. Do you want to discard them and switch to another activity?"
                    type="warning"
                />

                <Notification
                    notification={notification}
                    onClose={closeNotification}
                />
            </div>
        );
    };
    
    // Render the application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EnhancedWorkflowEditor />);
</script>

</body>
</html>

                                content = activity.test_cases || getDefaultContent(activityId, 'test');
                                console.log(`[DEBUG] Setting test content, length: ${content.length}`);
                                break;
                        }
                    } else {
                        console.error(`[DEBUG] No activity found in response for ${activityId}`);
                    }
                } else {
                    console.error(`[DEBUG] API request failed: ${response.status} ${response.statusText}`);
                }
            } catch (error) {
                console.error(`[DEBUG] Error in loadTabContent for ${activityId}/${type}:`, error);
                console.log(`Using default content for ${type}`);
            }
            
            // Set content during loading without marking as dirty
            console.log(`[DEBUG] About to setEditorContent for tabId: ${tabId}, content preview:`, content.substring(0, 50) + '...');
            setEditorContent(prev => {
                const newContent = {
                    ...prev,
                    [tabId]: content
                };
                console.log(`[DEBUG] setEditorContent called, new state:`, {
                    tabId,
                    contentLength: content.length,
                    allTabs: Object.keys(newContent),
                    currentTabContent: newContent[tabId]?.substring(0, 50) + '...'
                });
                return newContent;
            });
        };

        const getDefaultContent = (activityId, type) => {
            const activityName = activityId.split('-').map(word => 
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join('');
            
            switch (type) {
                case 'code':
                    return `// ${activityName} Activity Implementation
async function ${activityId.replace(/-/g, '_')}(context, input) {
    console.log('Starting ${activityName} activity');
    console.log('Input:', input);
    
    try {
        // TODO: Implement your ${activityName.toLowerCase()} logic here
        const result = {
            success: true,
            message: '${activityName} completed successfully',
            timestamp: new Date().toISOString(),
            data: input
        };
        
        return result;
    } catch (error) {
        console.error('Error in ${activityName}:', error);
        throw error;
    }
}

module.exports = ${activityId.replace(/-/g, '_')};`;

                case 'schema':
                    return JSON.stringify({
                        "$schema": "http://json-schema.org/draft-07/schema#",
                        "type": "object",
                        "title": `${activityName} Schema`,
                        "properties": {
                            "input": {
                                "type": "object",
                                "properties": {
                                    "data": { "type": "string", "description": "Input data" }
                                },
                                "required": ["data"]
                            }
                        }
                    }, null, 2);

                case 'test':
                    return `// Test Cases for ${activityName} Activity
const { expect } = require('chai');
const ${activityId.replace(/-/g, '_')} = require('./${activityId}');

describe('${activityName} Activity Tests', () => {
    it('should execute successfully with valid input', async () => {
        const input = { data: 'test data' };
        const result = await ${activityId.replace(/-/g, '_')}({}, input);
        
        expect(result).to.be.an('object');
        expect(result.success).to.be.true;
    });
});`;

                default:
                    return `// Default content for ${type}`;
            }
        };

        const onTabSelect = (tabId) => {
            setActiveTabId(tabId);
        };

        const onTabClose = (tabId) => {
            if (checkUnsavedChanges()) {
                showNotification('Please save your changes before closing tabs', 'warning');
                return;
            }
            
            setOpenTabs(prev => prev.filter(tab => tab.id !== tabId));
            if (activeTabId === tabId) {
                const remainingTabs = openTabs.filter(tab => tab.id !== tabId);
                setActiveTabId(remainingTabs.length > 0 ? remainingTabs[0].id : null);
            }
        };

        const onEditorChange = (tabId, value) => {
            // Only mark dirty if this is a user change, not initial loading
            const currentContent = editorContent[tabId];
            if (currentContent !== undefined && currentContent !== value) {
                setIsDirty(true);
            }
            setEditorContent(prev => ({
                ...prev,
                [tabId]: value
            }));
        };

        const saveCurrentTab = async () => {
            if (!activeTabId || !selectedActivity) return;
            
            try {
                // Simulate save operation
                await new Promise(resolve => setTimeout(resolve, 500));
                setIsDirty(false);
                showNotification('Changes saved successfully');
            } catch (error) {
                showNotification('Error saving changes', 'error');
            }
        };

        const runTests = () => {
            showNotification('Running tests...', 'success');
            // Simulate test execution
        };

        const generateWithAI = async () => {
            console.log('generateWithAI called');
            // Open the AI generation dialog
            console.log('Setting aiGenerationModalOpen to true');
            setAiGenerationModalOpen(true);
            console.log('aiGenerationModalOpen should now be true');
        };

        const handleAIGeneration = async () => {
            if (!generationGoal.trim()) {
                showNotification('Please enter a goal for AI generation', 'error');
                return;
            }

            setGenerationInProgress(true);
            setGenerationStatus('Preparing AI generation request...');

            try {
                // Prepare the request for workflow automation service
                const workflowRequest = {
                    goal: generationGoal,
                    context: {
                        currentActivity: selectedActivity?.name || 'New Activity',
                        activityDescription: selectedActivity?.description || '',
                        currentContent: activeTabId ? editorContent[activeTabId] || '' : '',
                        tabType: activeTab?.type || 'code'
                    },
                    aiConfig: {
                        provider: aiConfig.provider,
                        endpoint: aiConfig.endpoint,
                        model: aiConfig.model,
                        apiKey: aiConfig.apiKey
                    },
                    requestType: 'workflow_generation'
                };

                setGenerationStatus('Submitting request to workflow automation service...');

                // Connect to workflow automation service
                const workflowAutomationUrl = window.location.hostname === 'localhost' ? 
                    'http://localhost:8092' : 
                    `http://${window.location.hostname}:8092`;

                const response = await fetch(`${workflowAutomationUrl}/workflow-automation/api/workflows/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        requirements: generationGoal,
                        target_language: 'typescript',
                        auto_activate: true,
                        deploy_environment: 'development',
                        ai_config: {
                            provider: aiConfig.provider,
                            endpoint: aiConfig.endpoint.replace('localhost:', 'host.docker.internal:'),
                            model: aiConfig.model,
                            api_key: aiConfig.apiKey,
                            temperature: aiConfig.temperature,
                            max_tokens: aiConfig.maxTokens
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Workflow service error: ${response.status}`);
                }

                const result = await response.json();
                console.log('Workflow generation response:', result);
                
                const executionId = result.executionId || result.execution_id || result.workflowId || result.workflow_id;

                if (executionId) {
                    setGenerationStatus(`Generation started (ID: ${executionId}). Monitoring progress...`);
                    startPollingForResults(executionId, workflowAutomationUrl);
                } else {
                    console.error('No execution ID found in response:', result);
                    console.error('Available keys:', Object.keys(result));
                    throw new Error('No execution ID received from workflow service');
                }

            } catch (error) {
                console.error('AI Generation failed:', error);
                setGenerationStatus(null);
                setGenerationInProgress(false);
                showNotification(`AI generation failed: ${error.message}`, 'error');
            }
        };

        const startPollingForResults = (executionId, serviceUrl) => {
            const checkStatus = async () => {
                try {
                    const statusResponse = await fetch(`${serviceUrl}/workflow-automation/api/executions/${executionId}`);
                    
                    if (!statusResponse.ok) {
                        throw new Error(`Status check failed: ${statusResponse.status}`);
                    }

                    const statusData = await statusResponse.json();
                    setGenerationStatus(`Status: ${statusData.status} - ${statusData.message || 'Processing...'}`);

                    if (statusData.status === 'completed') {
                        clearInterval(pollingInterval);
                        setPollingInterval(null);
                        setGenerationInProgress(false);
                        setGenerationStatus(null);
                        
                        // Handle successful completion
                        if (statusData.result && statusData.result.workflow) {
                            handleSuccessfulGeneration(statusData.result);
                        } else {
                            showNotification('Generation completed but no workflow data received', 'warning');
                        }
                        
                        setAiGenerationModalOpen(false);
                        setGenerationGoal('');
                    } else if (statusData.status === 'failed' || statusData.status === 'error') {
                        clearInterval(pollingInterval);
                        setPollingInterval(null);
                        setGenerationInProgress(false);
                        setGenerationStatus(null);
                        showNotification(`Generation failed: ${statusData.message || 'Unknown error'}`, 'error');
                    }
                } catch (error) {
                    console.error('Status polling error:', error);
                    setGenerationStatus(`Polling error: ${error.message}`);
                }
            };

            // Start polling every 2 seconds
            const intervalId = setInterval(checkStatus, 2000);
            setPollingInterval(intervalId);
            
            // Initial check
            checkStatus();
        };

        const handleSuccessfulGeneration = (result) => {
            try {
                // If we have workflow data, try to load it into the editor
                if (result.workflow) {
                    const workflowContent = typeof result.workflow === 'string' ? 
                        result.workflow : 
                        JSON.stringify(result.workflow, null, 2);

                    // Update the current editor content
                    if (activeTabId) {
                        setEditorContent(prev => ({
                            ...prev,
                            [activeTabId]: workflowContent
                        }));
                        setIsDirty(true);
                    }

                    showNotification('AI generated workflow loaded successfully!', 'success');
                }

                // If we have activity data, add it to the activities list
                if (result.activities && Array.isArray(result.activities)) {
                    setActivities(prev => [...prev, ...result.activities]);
                    showNotification(`Added ${result.activities.length} new activities`, 'success');
                }

            } catch (error) {
                console.error('Error handling generation result:', error);
                showNotification('Generated content received but failed to load', 'warning');
            }
        };

        const cancelAIGeneration = () => {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                setPollingInterval(null);
            }
            setGenerationInProgress(false);
            setGenerationStatus(null);
            setAiGenerationModalOpen(false);
            setGenerationGoal('');
        };

        const handleModalConfirm = async () => {
            // Clear modal and pending state first
            setModalOpen(false);
            const activityToLoad = pendingActivity;
            setPendingActivity(null);
            
            // Reset dirty state completely
            setIsDirty(false);
            
            // Reload activities to get the latest changes
            await loadActivities();
            
            // Load the pending activity if there was one
            if (activityToLoad) {
                // Force load the activity without checking dirty state
                await onActivitySelect(activityToLoad);
            }
        };

        const handleModalClose = () => {
            setModalOpen(false);
            setPendingActivity(null);
        };

        const getLanguage = (tab) => {
            if (!tab) return 'javascript';
            switch (tab.type) {
                case 'code': return 'javascript';
                case 'schema': return 'json';
                case 'test': return 'javascript';
                default: return 'javascript';
            }
        };

        const activeTab = openTabs.find(tab => tab.id === activeTabId);
        const currentContent = activeTabId ? editorContent[activeTabId] || '' : '';
        
        // Debug logging for render
        console.log(`[DEBUG] Render - activeTabId:`, activeTabId);
        console.log(`[DEBUG] Render - activeTab:`, activeTab?.id);
        console.log(`[DEBUG] Render - editorContent keys:`, Object.keys(editorContent));
        console.log(`[DEBUG] Render - currentContent length:`, currentContent.length);
        console.log(`[DEBUG] Render - currentContent preview:`, currentContent.substring(0, 50) + '...');

        if (loading) {
            return (
                <div className="editor-container">
                    <div className="editor-loading">
                        <i className="fas fa-spinner fa-spin" style={{fontSize: '32px'}}></i>
                        <p>Loading Enhanced Editor...</p>
                    </div>
                </div>
            );
        }

        return (
            <div className="editor-container">
                <div className="editor-header">
                    <div className="header-title">
                        <svg width="24" height="24" viewBox="0 0 100 100" style={{marginRight: '8px'}}>
                            <defs>
                                <style>{`
                                    .ai-logo { fill: #ffffff; }
                                    .ai-logo-bg { fill: #2d3748; }
                                `}</style>
                            </defs>
                            <rect className="ai-logo-bg" width="100" height="100" rx="8"/>
                            <path className="ai-logo" d="M25 35 Q25 25, 35 25 L50 25 Q60 25, 65 35 L65 45 Q65 55, 60 60 L65 65 L60 70 L50 65 Q40 65, 35 55 L35 45 Q35 35, 25 35 Z M70 35 L75 35 L75 40 M70 45 L80 45 L80 50 M70 55 L75 55 L75 60"/>
                            <circle className="ai-logo" cx="77" cy="37" r="3"/>
                            <circle className="ai-logo" cx="82" cy="47" r="3"/>
                            <circle className="ai-logo" cx="77" cy="57" r="3"/>
                        </svg>
                        Activity Editor
                    </div>
                    <div className="header-actions">
                        <button className="btn" onClick={saveCurrentTab} disabled={!isDirty}>
                            <i className="fas fa-save"></i>
                            Save (Ctrl+S)
                        </button>
                        <button className="btn" onClick={runTests}>
                            <i className="fas fa-play"></i>
                            Run Tests
                        </button>
                        <button className="btn" onClick={generateWithAI}>
                            <i className="fas fa-magic"></i>
                            AI Generate
                        </button>
                        <button className="btn" onClick={() => setConfigModalOpen(true)}>
                            <i className="fas fa-cog"></i>
                            AI Config
                        </button>
                    </div>
                </div>
                
                <div className="editor-body">
                    <ActivityExplorer 
                        activities={activities}
                        onActivitySelect={onActivitySelect}
                        onActivityDelete={onActivityDelete}
                        selectedActivity={selectedActivity}
                    />
                    
                    <div className="editor-main">
                        <div className="editor-tabs">
                            {openTabs.map(tab => (
                                <EditorTab
                                    key={tab.id}
                                    tab={tab}
                                    isActive={tab.id === activeTabId}
                                    onSelect={() => onTabSelect(tab.id)}
                                    onClose={() => onTabClose(tab.id)}
                                />
                            ))}
                        </div>
                        
                        <div className="editor-content">
                            {(() => {
                                console.log(`[DEBUG] Editor content render - activeTab:`, activeTab?.title, 'activeTabId:', activeTabId);
                                console.log(`[DEBUG] currentContent length:`, currentContent?.length, 'preview:', currentContent?.substring(0, 100));
                                console.log(`[DEBUG] getLanguage result:`, getLanguage(activeTab));
                                return null;
                            })()}
                            {activeTab ? (
                                <MonacoEditor
                                    value={currentContent}
                                    language={getLanguage(activeTab)}
                                    onChange={(value) => onEditorChange(activeTabId, value)}
                                    theme="vs-dark"
                                />
                            ) : (
                                <div className="empty-state">
                                    <i className="fas fa-folder-open"></i>
                                    <p>Select an activity to start editing</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
                
                <div className="status-bar">
                    <div>
                        {activeTab ? `${activeTab.title} - ${getLanguage(activeTab)}` : 'No file selected'}
                        {isDirty && <span style={{color: 'var(--warning-color)'}}> • Modified</span>}
                    </div>
                    <div>
                        {selectedActivity ? `Activity: ${selectedActivity.name}` : 'No activity selected'} | 
                        Session: {sessionId.slice(-8)} | 
                        AI Modal: {aiGenerationModalOpen ? 'OPEN' : 'CLOSED'}
                    </div>
                </div>

                <ConfirmationModal
                    isOpen={modalOpen}
                    onClose={handleModalClose}
                    onConfirm={handleModalConfirm}
                    title="Unsaved Changes"
                    message="You have unsaved changes. Do you want to discard them and switch to another activity?"
                    type="warning"
                />

                <AIConfigModal
                    isOpen={configModalOpen}
                    onClose={() => setConfigModalOpen(false)}
                    config={aiConfig}
                    onSave={setAiConfig}
                    providers={aiProviders}
                    connectionStatus={connectionStatus}
                    onTestConnection={testAIConnection}
                />

                {aiGenerationModalOpen && (
                    <div className="modal-overlay" onClick={cancelAIGeneration}>
                        <div className="modal" onClick={(e) => e.stopPropagation()}>
                            <div className="modal-header">
                                <h3>AI Workflow Generation</h3>
                                <button className="modal-close" onClick={cancelAIGeneration}>
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                            <div className="modal-body">
                                <div style={{marginBottom: '16px'}}>
                                    <label style={{display: 'block', marginBottom: '8px', fontWeight: '500'}}>
                                        What would you like the AI to generate?
                                    </label>
                                    <textarea
                                        value={generationGoal}
                                        onChange={(e) => setGenerationGoal(e.target.value)}
                                        placeholder="Describe your workflow or activity goal. For example: 'Create a workflow that processes customer orders and sends email confirmations' or 'Generate an activity that validates user input data'"
                                        style={{
                                            width: '100%',
                                            height: '120px',
                                            padding: '12px',
                                            border: '1px solid var(--border-color)',
                                            borderRadius: '4px',
                                            background: 'var(--bg-primary)',
                                            color: 'var(--text-primary)',
                                            resize: 'vertical',
                                            fontFamily: 'inherit'
                                        }}
                                        disabled={generationInProgress}
                                    />
                                </div>
                                
                                {generationInProgress && (
                                    <div style={{
                                        padding: '12px',
                                        background: 'var(--bg-secondary)',
                                        border: '1px solid var(--border-color)',
                                        borderRadius: '4px',
                                        marginBottom: '16px'
                                    }}>
                                        <div style={{display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px'}}>
                                            <div style={{
                                                width: '16px',
                                                height: '16px',
                                                border: '2px solid var(--accent-color)',
                                                borderTop: '2px solid transparent',
                                                borderRadius: '50%',
                                                animation: 'spin 1s linear infinite'
                                            }}></div>
                                            <span style={{fontWeight: '500'}}>Generating...</span>
                                        </div>
                                        {generationStatus && (
                                            <div style={{fontSize: '14px', color: 'var(--text-secondary)'}}>
                                                {generationStatus}
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div style={{
                                    fontSize: '14px',
                                    color: 'var(--text-secondary)',
                                    padding: '12px',
                                    background: 'var(--bg-secondary)',
                                    borderRadius: '4px',
                                    border: '1px solid var(--border-color)'
                                }}>
                                    <strong>How it works:</strong>
                                    <ul style={{margin: '8px 0 0 16px', padding: 0}}>
                                        <li>Your request will be sent to the workflow automation service</li>
                                        <li>The AI will use your configured provider: {aiProviders[aiConfig.provider]?.name} ({aiConfig.endpoint})</li>
                                        <li>Generated workflows/activities will be loaded into the editor</li>
                                        <li>You can monitor the progress in real-time</li>
                                    </ul>
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button 
                                    className="btn btn-secondary" 
                                    onClick={cancelAIGeneration}
                                    disabled={generationInProgress}
                                >
                                    {generationInProgress ? 'Cancel' : 'Close'}
                                </button>
                                <button 
                                    className="btn btn-primary" 
                                    onClick={handleAIGeneration}
                                    disabled={generationInProgress || !generationGoal.trim()}
                                >
                                    <i className="fas fa-magic"></i>
                                    Generate Workflow
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                <Notification
                    notification={notification}
                    onClose={closeNotification}
                />
            </div>
        );
    };
    
    // Render the application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<EnhancedWorkflowEditor />);
</script>

</body>
</html>

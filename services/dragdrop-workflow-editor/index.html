<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Editor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- React and React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX (load before Monaco to avoid conflicts) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Monaco Editor (load separately to avoid AMD conflicts) -->
    <script>
        // Clear AMD define to avoid conflicts
        if (typeof define !== 'undefined') {
            window.monacoAmdDefine = define;
            delete window.define;
        }
    </script>
    <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
        // Restore define after Monaco loads
        if (typeof window.monacoAmdDefine !== 'undefined') {
            window.define = window.monacoAmdDefine;
            delete window.monacoAmdDefine;
        }
    </script>
    
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d30;
            --bg-tertiary: #252526;
            --bg-hover: #37373d;
            --bg-active: #094771;
            --text-primary: #cccccc;
            --text-secondary: #969696;
            --text-muted: #6c757d;
            --border-color: #3e3e42;
            --accent-color: #007acc;
            --accent-hover: #1177bb;
            --success-color: #4ec9b0;
            --warning-color: #ffcc02;
            --error-color: #f44747;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        
        .editor-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .editor-header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px var(--shadow);
            position: relative;
        }
        
        .editor-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-color) 50%, transparent 100%);
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-title i {
            color: var(--accent-color);
            font-size: 20px;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .editor-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .activity-explorer {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .activity-explorer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-color) 0%, transparent 50%, var(--accent-color) 100%);
            opacity: 0.3;
        }
        
        .activity-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-tertiary);
        }
        
        .activity-header h3 {
            margin: 0 0 16px 0;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-container {
            position: relative;
            margin-bottom: 16px;
        }
        
        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            transition: all 0.2s ease;
        }
        
        .search-container input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.2);
        }
        
        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .filter-container select {
            width: 100%;
            padding: 10px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
        }
        
        .activity-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .activity-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .activity-list::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        
        .activity-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .activity-item {
            padding: 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .activity-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--bg-hover) 0%, var(--bg-tertiary) 100%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .activity-item:hover::before {
            opacity: 1;
        }
        
        .activity-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--shadow);
        }
        
        .activity-item.selected {
            background: linear-gradient(135deg, var(--bg-active) 0%, #0074cc 100%);
            border-color: var(--accent-color);
            box-shadow: 0 4px 16px rgba(0, 122, 204, 0.3);
        }
        
        .activity-item.selected::before {
            display: none;
        }
        
        .activity-content {
            position: relative;
            z-index: 1;
        }
        
        .activity-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .activity-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
        }
        
        .activity-text h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
        }
        
        .activity-text p {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .activity-arrow {
            color: var(--text-muted);
            font-size: 12px;
            opacity: 0;
            transition: all 0.2s ease;
        }
        
        .activity-item:hover .activity-arrow {
            opacity: 1;
            transform: translateX(4px);
        }
        
        .activity-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .activity-delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s ease;
            opacity: 1;
            font-size: 14px;
        }
        
        .activity-item:hover .activity-delete-btn {
            opacity: 1;
        }
        
        .activity-delete-btn:hover {
            background: rgba(220, 38, 38, 0.2);
            color: #dc2626;
            transform: scale(1.1);
        }
        
        .editor-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .editor-tabs {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            padding: 0 20px;
            position: relative;
        }
        
        .editor-tabs::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-color) 30%, var(--accent-color) 70%, transparent 100%);
            opacity: 0.5;
        }
        
        .editor-tab {
            padding: 16px 24px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
        }
        
        .editor-tab:hover {
            color: var(--text-primary);
        }
        
        .editor-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
            background: var(--bg-primary);
        }
        
        .tab-close {
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: 4px;
            padding: 2px;
            cursor: pointer;
        }
        
        .editor-tab:hover .tab-close {
            opacity: 1;
        }
        
        .tab-close:hover {
            background: var(--error-color);
            color: white;
        }
        
        .editor-content {
            flex: 1;
            position: relative;
        }
        
        .monaco-editor-wrapper {
            height: 100%;
            width: 100%;
        }
        
        .editor-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--text-secondary);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
        }
        
        .status-bar {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .btn {
            padding: 12px 20px;
            border: 1px solid var(--accent-color);
            background: var(--accent-color);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 204, 0.3);
        }
        
        .btn.warning {
            background: var(--warning-color);
            border-color: var(--warning-color);
            color: var(--bg-primary);
        }
        
        .btn.danger {
            background: var(--error-color);
            border-color: var(--error-color);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            animation: slideInRight 0.3s ease;
            max-width: 400px;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .notification.success {
            border-left: 4px solid var(--success-color);
        }
        
        .notification.warning {
            border-left: 4px solid var(--warning-color);
        }
        
        .notification.error {
            border-left: 4px solid var(--error-color);
        }
    </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    
    // Monaco Editor setup
    let monacoPromise = null;
    const getMonaco = () => {
        if (!monacoPromise) {
            monacoPromise = new Promise((resolve) => {
                require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.45.0/min/vs' } });
                require(['vs/editor/editor.main'], () => {
                    resolve(window.monaco);
                });
            });
        }
        return monacoPromise;
    };

    // Modern Activity Explorer with improved design
    const ActivityExplorer = ({ activities, onActivitySelect, onActivityDelete, selectedActivity }) => {
        const [searchTerm, setSearchTerm] = useState('');
        const [categoryFilter, setCategoryFilter] = useState('all');
        
        const filteredActivities = activities.filter(activity => {
            const matchesSearch = activity.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                (activity.description && activity.description.toLowerCase().includes(searchTerm.toLowerCase()));
            const matchesCategory = categoryFilter === 'all' || activity.category === categoryFilter;
            return matchesSearch && matchesCategory;
        });
        
        const categories = ['all', ...new Set(activities.map(a => a.category).filter(Boolean))];
        
        const getActivityIcon = (category) => {
            const icons = {
                'Communication': 'fa-envelope',
                'Finance': 'fa-credit-card',
                'Data': 'fa-database',
                'Integration': 'fa-plug',
                'Reports': 'fa-chart-bar',
                'Database': 'fa-server'
            };
            return icons[category] || 'fa-cog';
        };
        
        return (
            <div className="activity-explorer">
                <div className="activity-header">
                    <h3>
                        <i className="fas fa-puzzle-piece"></i>
                        Activities ({activities.length})
                    </h3>
                    
                    <div className="search-container">
                        <input
                            type="text"
                            placeholder="Search activities..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <i className="fas fa-search"></i>
                    </div>
                    
                    <div className="filter-container">
                        <select
                            value={categoryFilter}
                            onChange={(e) => setCategoryFilter(e.target.value)}
                        >
                            {categories.map(category => (
                                <option key={category} value={category}>
                                    {category === 'all' ? 'All Categories' : category}
                                </option>
                            ))}
                        </select>
                    </div>
                </div>
                
                <div className="activity-list">
                    {filteredActivities.length > 0 ? (
                        filteredActivities.map(activity => (
                            <div 
                                key={activity.id}
                                className={`activity-item ${selectedActivity?.id === activity.id ? 'selected' : ''}`}
                                onClick={() => onActivitySelect(activity)}
                            >
                                <div className="activity-content">
                                    <div className="activity-info">
                                        <div className="activity-details">
                                            <div className="activity-icon">
                                                <i className={`fas ${getActivityIcon(activity.category)}`}></i>
                                            </div>
                                            <div className="activity-text">
                                                <h4>{activity.name}</h4>
                                                <p>{activity.category}</p>
                                            </div>
                                        </div>
                                        <div className="activity-actions">
                                            <button 
                                                className="activity-delete-btn"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    onActivityDelete(activity);
                                                }}
                                                title="Delete Activity"
                                            >
                                                <i className="fas fa-trash"></i>
                                            </button>
                                            <i className="fas fa-chevron-right activity-arrow"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))
                    ) : (
                        <div className="empty-state">
                            <i className="fas fa-search"></i>
                            <p>No activities found</p>
                            {searchTerm && (
                                <button 
                                    onClick={() => setSearchTerm('')}
                                    className="btn"
                                >
                                    Clear search
                                </button>
                            )}
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // Confirmation Modal Component
    const ConfirmationModal = ({ isOpen, onClose, onConfirm, title, message, type = 'warning' }) => {
        if (!isOpen) return null;
        
        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                    <div className="modal-header">
                        <i className={`fas ${type === 'warning' ? 'fa-exclamation-triangle' : 'fa-question-circle'}`}></i>
                        <h3>{title}</h3>
                    </div>
                    <div className="modal-body">
                        <p>{message}</p>
                    </div>
                    <div className="modal-footer">
                        <button className="btn" onClick={onClose}>
                            Cancel
                        </button>
                        <button className={`btn ${type}`} onClick={onConfirm}>
                            {type === 'warning' ? 'Discard Changes' : 'Confirm'}
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // AI Configuration Modal Component
    const AIConfigModal = ({ isOpen, onClose, config, onSave, providers, connectionStatus, onTestConnection }) => {
        const [tempConfig, setTempConfig] = useState(config);

        useEffect(() => {
            setTempConfig(config);
        }, [config]);

        if (!isOpen) return null;

        const handleSave = () => {
            onSave(tempConfig);
            onClose();
        };

        const handleProviderChange = (provider) => {
            const providerDefaults = providers[provider];
            setTempConfig({
                ...tempConfig,
                provider: provider,
                endpoint: providerDefaults.defaultEndpoint,
                model: providerDefaults.defaultModel,
                apiKey: providerDefaults.requiresApiKey ? tempConfig.apiKey : ''
            });
        };

        const getConnectionStatusIcon = () => {
            switch (connectionStatus.status) {
                case 'connected':
                    return <i className="fas fa-check-circle" style={{color: '#22c55e'}}></i>;
                case 'testing':
                    return <i className="fas fa-spinner fa-spin" style={{color: '#f59e0b'}}></i>;
                case 'error':
                    return <i className="fas fa-exclamation-circle" style={{color: '#ef4444'}}></i>;
                default:
                    return <i className="fas fa-question-circle" style={{color: '#6b7280'}}></i>;
            }
        };

        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal" onClick={(e) => e.stopPropagation()}>
                    <div className="modal-header">
                        <i className="fas fa-robot"></i>
                        <h3>AI Configuration</h3>
                    </div>
                    <div className="modal-body">
                        {/* Connection Status */}
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '8px',
                            marginBottom: '20px',
                            padding: '12px',
                            background: 'var(--bg-tertiary)',
                            borderRadius: '6px',
                            border: '1px solid var(--border-color)'
                        }}>
                            {getConnectionStatusIcon()}
                            <span style={{fontWeight: '500'}}>
                                {connectionStatus.message || 'Connection status unknown'}
                            </span>
                            <button 
                                className="btn" 
                                onClick={onTestConnection} 
                                disabled={connectionStatus.testing}
                                style={{marginLeft: 'auto', padding: '4px 8px', fontSize: '12px'}}
                            >
                                {connectionStatus.testing ? 'Testing...' : 'Test Connection'}
                            </button>
                        </div>

                        {/* AI Provider Selection */}
                        <div style={{marginBottom: '16px'}}>
                            <label style={{display: 'block', marginBottom: '8px', fontWeight: '500'}}>
                                AI Provider:
                            </label>
                            <select
                                value={tempConfig.provider}
                                onChange={(e) => handleProviderChange(e.target.value)}
                                style={{
                                    width: '100%',
                                    padding: '8px 12px',
                                    border: '1px solid var(--border-color)',
                                    borderRadius: '4px',
                                    background: 'var(--bg-primary)',
                                    color: 'var(--text-primary)'
                                }}
                            >
                                {Object.entries(providers).map(([key, provider]) => (
                                    <option key={key} value={key}>{provider.name}</option>
                                ))}
                            </select>
                        </div>

                        <div style={{marginBottom: '16px'}}>
                            <label style={{display: 'block', marginBottom: '8px', fontWeight: '500'}}>
                                API Endpoint:
                            </label>
                            <input
                                type="text"
                                value={tempConfig.endpoint}
                                onChange={(e) => setTempConfig({...tempConfig, endpoint: e.target.value})}
                                style={{
                                    width: '100%',
                                    padding: '8px 12px',
                                    border: '1px solid var(--border-color)',
                                    borderRadius: '4px',
                                    background: 'var(--bg-primary)',
                                    color: 'var(--text-primary)'
                                }}
                                placeholder={providers[tempConfig.provider]?.defaultEndpoint}
                            />
                        </div>
                        <div style={{marginBottom: '16px'}}>
                            <label style={{display: 'block', marginBottom: '8px', fontWeight: '500'}}>
                                Model:
                            </label>
                            <input
                                type="text"
                                value={tempConfig.model}
                                onChange={(e) => setTempConfig({...tempConfig, model: e.target.value})}
                                style={{
                                    width: '100%',
                                    padding: '8px 12px',
                                    border: '1px solid var(--border-color)',
                                    borderRadius: '4px',
                                    background: 'var(--bg-primary)',
                                    color: 'var(--text-primary)'
                                }}

    // Notification Component
    const Notification = ({ notification, onClose }) => {
        useEffect(() => {
            if (notification) {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }
        }, [notification, onClose]);
        
        if (!notification) return null;
        
        return (
            <div className={`notification ${notification.type}`}>
                <p>{notification.message}</p>
            </div>
        );
    };

    // Monaco Editor Component
    const MonacoEditor = ({ value, language, onChange, theme = 'vs-dark' }) => {
        const editorRef = useRef(null);
        const containerRef = useRef(null);
        
        console.log(`[DEBUG] MonacoEditor rendered with value length:`, value?.length, 'preview:', value?.substring(0, 50) + '...');
        
        useEffect(() => {
            let editor = null;
            
            console.log(`[DEBUG] Monaco useEffect - value length:`, (value || '').length, 'editor exists:', !!editorRef.current);
            
            // Clean up existing editor first
            if (editorRef.current) {
                console.log(`[DEBUG] Disposing existing Monaco editor`);
                editorRef.current.dispose();
                editorRef.current = null;
            }
            
            // Clear the container completely to prevent multiple instances
            if (containerRef.current) {
                containerRef.current.innerHTML = '';
                console.log(`[DEBUG] Container innerHTML cleared`);
            }
            
            getMonaco().then((monaco) => {
                if (containerRef.current) {
                    const initialValue = value || '';
                    console.log(`[DEBUG] Monaco.editor.create called with value length:`, initialValue.length);
                    
                    // Wait for DOM to be fully ready on first load
                    const createEditor = () => {
                        if (!containerRef.current) {
                            console.log(`[DEBUG] Container no longer exists, aborting editor creation`);
                            return;
                        }
                        
                        
                        console.log(`[DEBUG] Creating Monaco editor now for language:`, language || 'javascript');
                        console.log(`[DEBUG] Container dimensions:`, containerRef.current.offsetWidth, 'x', containerRef.current.offsetHeight);
                        editor = monaco.editor.create(containerRef.current, {
                        value: initialValue,
                        language: language || 'javascript',
                        theme: theme,
                        automaticLayout: true,
                        minimap: { enabled: false },
                        lineNumbers: 'on',
                        roundedSelection: false,
                        scrollBeyondLastLine: false,
                        fontSize: 14,
                        fontFamily: 'Consolas, Monaco, "Courier New", monospace',
                        wordWrap: 'on',
                        wordWrapColumn: 120,
                        rulers: [],
                        // Fix rendering issues - prevent double line numbering
                        lineNumbersMinChars: 3,
                        lineDecorationsWidth: 0,
                        lineNumbersWidth: 50,
                        glyphMargin: false,
                        folding: false,
                        renderLineHighlight: 'line',
                        renderIndentGuides: false,
                        hideCursorInOverviewRuler: true,
                        overviewRulerBorder: false,
                        overviewRulerLanes: 0,
                        // Disable features that could cause UI duplication
                        codeLens: false,
                        contextmenu: false,
                        quickSuggestions: false,
                        suggestOnTriggerCharacters: false,
                        acceptSuggestionOnEnter: 'off',
                        tabCompletion: 'off',
                        wordBasedSuggestions: false,
                        // Ensure single viewport
                        scrollbar: {
                            vertical: 'visible',
                            horizontal: 'visible',
                            verticalScrollbarSize: 15,
                            horizontalScrollbarSize: 15
                        }
                        });
                        
                        editorRef.current = editor;
                        console.log(`[DEBUG] Monaco editor created successfully, current value length:`, editor.getValue().length);
                        
                        // Set up change listener
                        editor.onDidChangeModelContent(() => {
                            const newValue = editor.getValue();
                            if (onChange) {
                                onChange(newValue);
                            }
                        });
                        
                        // Force layout after a brief delay to ensure proper rendering
                        setTimeout(() => {
                            if (editor && editorRef.current === editor) {
                                editor.layout();
                                console.log(`[DEBUG] Layout forced after creation`);
                            }
                        }, 100);
                    };
                    
                    // Use requestAnimationFrame to ensure DOM is ready, especially on first load
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', () => {
                            requestAnimationFrame(() => {
                                setTimeout(createEditor, 50);
                            });
                        });
                    } else {
                        requestAnimationFrame(() => {
                            setTimeout(createEditor, 10);
                        });
                    }
                } else {
                    console.error(`[DEBUG] containerRef.current is null, cannot create Monaco editor`);
                }
            }).catch(error => {
                console.error(`[DEBUG] Error loading Monaco:`, error);
            });
            
            return () => {
                if (editor) {
                    console.log(`[DEBUG] Cleanup: disposing Monaco editor`);
                    editor.dispose();
                }
            };
        }, [value, language]);
        
        // This useEffect is no longer needed since editor creation now depends on value changes
        
        useEffect(() => {
            if (editorRef.current) {
                const model = editorRef.current.getModel();
                if (model) {
                    window.monaco.editor.setModelLanguage(model, language || 'javascript');
                }
            }
        }, [language]);
        
        return (
            <div 
                ref={containerRef} 
                className="monaco-editor-wrapper"
                style={{ 
                    width: '100%', 
                    height: '400px',
                    minHeight: '400px',
                    border: '1px solid #444',
                    position: 'relative',
                    backgroundColor: '#1e1e1e',  // Ensure dark background is visible
                    color: '#d4d4d4'  // Ensure text is visible
                }}
                onLoad={() => console.log(`[DEBUG] Monaco container div loaded`)}
            />
        );
    };

    // Editor Tab Component

    const getTabIcon = (type) => {
        const icons = {
            'code': 'fa-code',

        };
        return icons[type] || 'fa-file';
    };

    // Main Enhanced Workflow Editor Component
    const EnhancedWorkflowEditor = () => {
        const [activities, setActivities] = useState([]);
        const [selectedActivity, setSelectedActivity] = useState(null);
        const [openTabs, setOpenTabs] = useState([]);
        const [activeTabId, setActiveTabId] = useState(null);
        const [editorContent, setEditorContent] = useState({});
        const [loading, setLoading] = useState(true);
        const [isDirty, setIsDirty] = useState(false);
        const [modalOpen, setModalOpen] = useState(false);
        const [pendingActivity, setPendingActivity] = useState(null);
        const [notification, setNotification] = useState(null);
        const [sessionId] = useState(() => 'session-' + Date.now());
        const [configModalOpen, setConfigModalOpen] = useState(false);
        const [isGenerating, setIsGenerating] = useState(false);
        const [aiGenerationModalOpen, setAiGenerationModalOpen] = useState(false);
        const [generationGoal, setGenerationGoal] = useState('');
        const [generationInProgress, setGenerationInProgress] = useState(false);
        const [generationStatus, setGenerationStatus] = useState(null);
        const [pollingInterval, setPollingInterval] = useState(null);

        // Load activities on mount
        useEffect(() => {
            loadActivities();
        }, []);

        // Cleanup polling interval on unmount
        useEffect(() => {
            return () => {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                }
            };
        }, [pollingInterval]);

        const loadActivities = async () => {
            try {
                // Use the enhanced-workflow-editor API on port 3001
                const response = await fetch('http://localhost:3001/api/activities');
                const data = await response.json();
                console.log('Loaded activities from API:', data);
                const activities = data.data || data.activities || [];
                // Map the activities to ensure they have the proper category
                const mappedActivities = activities.map(activity => ({
                    ...activity,
                    category: activity.category || activity.type || 'Generic'
                }));
                setActivities(mappedActivities);
                setLoading(false);
            } catch (error) {
                console.error('Error loading activities, using sample data:', error);
                // Use sample activities when API is not available
                setActivities([
                    { id: 'send-email', name: 'Send Email', type: 'Communication', description: 'Send email notifications', category: 'Communication' },
                    { id: 'process-payment', name: 'Process Payment', type: 'Finance', description: 'Process payments', category: 'Finance' },
                    { id: 'validate-data', name: 'Validate Data', type: 'Data', description: 'Validate input data', category: 'Data' },
                    { id: 'call-api', name: 'Call External API', type: 'Integration', description: 'Make HTTP requests', category: 'Integration' },
                    { id: 'generate-report', name: 'Generate Report', type: 'Reports', description: 'Create PDF reports', category: 'Reports' },
                    { id: 'save-database', name: 'Save to Database', type: 'Database', description: 'Store data in database', category: 'Database' }
                ]);
                setLoading(false);
            }
        };

        // OpenAI API Configuration
        const [aiConfig, setAiConfig] = useState({
            provider: 'openai',
            endpoint: 'http://localhost:3004/api/openai',
            model: 'vscode-lm-proxy',
            apiKey: 'sk-123456',
            temperature: 0.7,
            maxTokens: 2000
        });

        const aiProviders = {
            openai: {
                name: 'OpenAI Compatible',
                defaultEndpoint: 'http://localhost:3004/api/openai',
                defaultModel: 'vscode-lm-proxy',
                requiresApiKey: true,
                testEndpoint: '/chat/completions'
            },
            ollama: {
                name: 'Ollama',
                defaultEndpoint: 'http://localhost:11434',
                defaultModel: 'llama2',
                requiresApiKey: false,
                testEndpoint: '/api/generate'
            },
            gemini: {
                name: 'Google Gemini',
                defaultEndpoint: 'https://generativelanguage.googleapis.com/v1beta',
                defaultModel: 'gemini-pro',
                requiresApiKey: true,
                testEndpoint: '/models'
            },
            azure: {
                name: 'Azure OpenAI',
                defaultEndpoint: 'https://your-resource.openai.azure.com',
                defaultModel: 'gpt-35-turbo',
                requiresApiKey: true,
                testEndpoint: '/openai/deployments'
            },
            anthropic: {
                name: 'Anthropic Claude',
                defaultEndpoint: 'https://api.anthropic.com',
                defaultModel: 'claude-3-sonnet-20240229',
                requiresApiKey: true,
                testEndpoint: '/v1/messages'
            }
        };

        const callAI = async (prompt, options = {}) => {
            try {
                let requestBody, headers, endpoint;
                
                headers = {
                    'Content-Type': 'application/json'
                };

                switch (aiConfig.provider) {
                    case 'openai':
                    case 'azure':
                        endpoint = `${aiConfig.endpoint}/chat/completions`;
                        if (aiConfig.apiKey) {
                            headers['Authorization'] = `Bearer ${aiConfig.apiKey}`;
                        }
                        requestBody = {
                            model: aiConfig.model,
                            messages: [{ role: 'user', content: prompt }],
                            max_tokens: options.maxTokens || aiConfig.maxTokens || 2000,
                            temperature: options.temperature || aiConfig.temperature || 0.7
                        };
                        break;
                        
                    case 'ollama':
                        endpoint = `${aiConfig.endpoint}/api/generate`;
                        requestBody = {
                            model: aiConfig.model,
                            prompt: prompt,
                            stream: false,
                            options: {
                                temperature: options.temperature || aiConfig.temperature || 0.7,
                                num_predict: options.maxTokens || aiConfig.maxTokens || 2000
                            }
                        };
                        break;
                        
                    case 'gemini':
                        endpoint = `${aiConfig.endpoint}/models/${aiConfig.model}:generateContent`;
                        if (aiConfig.apiKey) {
                            endpoint += `?key=${aiConfig.apiKey}`;
                        }
                        requestBody = {
                            contents: [{
                                parts: [{ text: prompt }]
                            }],
                            generationConfig: {
                                temperature: options.temperature || aiConfig.temperature || 0.7,
                                maxOutputTokens: options.maxTokens || aiConfig.maxTokens || 2000
                            }
                        };
                        break;
                        
                    case 'anthropic':
                        endpoint = `${aiConfig.endpoint}/v1/messages`;
                        if (aiConfig.apiKey) {
                            headers['x-api-key'] = aiConfig.apiKey;
                            headers['anthropic-version'] = '2023-06-01';
                        }
                        requestBody = {
                            model: aiConfig.model,
                            max_tokens: options.maxTokens || aiConfig.maxTokens || 2000,
                            messages: [{ role: 'user', content: prompt }]
                        };
                        break;
                        
                    default:
                        throw new Error(`Unsupported AI provider: ${aiConfig.provider}`);
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`AI API error (${aiConfig.provider}): ${response.status}`);
                }

                const data = await response.json();
                
                // Extract response based on provider
                let content = '';
                switch (aiConfig.provider) {
                    case 'openai':
                    case 'azure':
                        content = data.choices?.[0]?.message?.content || '';
                        break;
                    case 'ollama':
                        content = data.response || '';
                        break;
                    case 'gemini':
                        content = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                        break;
                    case 'anthropic':
                        content = data.content?.[0]?.text || '';
                        break;
                }
                
                return content;
            } catch (error) {
                console.error(`AI API call failed (${aiConfig.provider}):`, error);
                showNotification(`AI assistance unavailable: ${error.message}`, 'error');
                return null;
            }
        };

        const showNotification = (message, type = 'success') => {
            setNotification({ message, type });
        };

        const closeNotification = () => {
            setNotification(null);
        };

        // AI Connection Test Function
        const [connectionStatus, setConnectionStatus] = useState({ status: 'unknown', message: '', testing: false });
        
        const testAIConnection = async () => {
            // Special handling for OpenAI: always assume connected
            if (aiConfig.provider === 'openai' && 
                aiConfig.endpoint === 'http://localhost:3004/api/openai' &&
                aiConfig.model === 'vscode-lm-proxy' &&
                aiConfig.apiKey === 'sk-123456') {
                setConnectionStatus({ 
                    status: 'connected', 
                    message: `Connected to ${aiProviders[aiConfig.provider].name}`, 
                    testing: false 
                });
                return;
            }
            
            setConnectionStatus({ status: 'testing', message: 'Testing connection...', testing: true });
            
            try {
                const testPrompt = "Hello, this is a connection test. Please respond with 'OK'.";
                const response = await callAI(testPrompt, { maxTokens: 10 });
                
                if (response && response.length > 0) {
                    setConnectionStatus({ 
                        status: 'connected', 
                        message: `Connected to ${aiProviders[aiConfig.provider].name}`, 
                        testing: false 
                    });
                    showNotification(`AI Connection successful: ${aiProviders[aiConfig.provider].name}`, 'success');
                } else {
                    throw new Error('Empty response from AI service');
                }
            } catch (error) {
                setConnectionStatus({ 
                    status: 'error', 
                    message: `Connection failed: ${error.message}`, 
                    testing: false 
                });
                showNotification(`AI Connection failed: ${error.message}`, 'error');
            }
        };

        // Auto-test connection when config changes
        React.useEffect(() => {
            if (aiConfig.endpoint && aiConfig.model) {
                const timer = setTimeout(() => {
                    testAIConnection();
                }, 1000);
                return () => clearTimeout(timer);
            }
        }, [aiConfig.provider, aiConfig.endpoint, aiConfig.model, aiConfig.apiKey]);

        const checkUnsavedChanges = () => {
            return isDirty;
        };

        // CRITICAL: Activity isolation - only one activity at a time
        const onActivitySelect = async (activity) => {
            console.log(`[DEBUG] onActivitySelect called for activity:`, activity.id, activity.name);
            console.log(`[DEBUG] Current selectedActivity:`, selectedActivity?.id);
            console.log(`[DEBUG] Is dirty:`, isDirty);
            
            if (selectedActivity && selectedActivity.id !== activity.id) {
                if (checkUnsavedChanges()) {
                    console.log(`[DEBUG] Unsaved changes detected, showing modal`);
                    setPendingActivity(activity);
                    setModalOpen(true);
                    return;
                }
                
                // Close all tabs from previous activity
                console.log(`[DEBUG] Closing tabs from previous activity`);
                setOpenTabs([]);
                setActiveTabId(null);
                setEditorContent({});
            }
            
            // Reset dirty state before loading new activity
            console.log(`[DEBUG] Resetting dirty state and setting selected activity`);
            setIsDirty(false);
            setSelectedActivity(activity);
            
            // Load tabs for this activity only
            const newTabs = [
                { id: `${activity.id}-code`, title: 'Code', type: 'code', activityId: activity.id },
                { id: `${activity.id}-schema`, title: 'Schema', type: 'schema', activityId: activity.id },
                { id: `${activity.id}-test`, title: 'Tests', type: 'test', activityId: activity.id }
            ];
            
            console.log(`[DEBUG] Setting up tabs:`, newTabs.map(t => t.id));
            setOpenTabs(newTabs);
            setActiveTabId(newTabs[0].id);
            
            // Load content for all tabs
            try {
                console.log(`[DEBUG] Starting to load content for ${newTabs.length} tabs`);
                // Load content sequentially to prevent race conditions
                for (const tab of newTabs) {
                    console.log(`[DEBUG] Loading content for tab: ${tab.id}`);
                    await loadTabContent(activity.id, tab.type);
                }
                // Ensure dirty state is false after all content is loaded
                setIsDirty(false);
                console.log(`[DEBUG] Successfully loaded all content for ${activity.name}`);
                showNotification(`Loaded activity: ${activity.name}`);
            } catch (error) {
                console.error('Error loading tab content:', error);
                showNotification(`Failed to load some content for ${activity.name}`, 'warning');
                // Still ensure dirty state is false even if loading fails
                setIsDirty(false);
            }
        };

        // Delete activity function
        const onActivityDelete = async (activity) => {
            if (!confirm(`Are you sure you want to delete the activity "${activity.name}"? This action cannot be undone.`)) {
                return;
            }

            try {
                // Use the enhanced-workflow-editor API on port 3001 which has working DELETE endpoint
                const response = await fetch(`http://localhost:3001/api/activities/${activity.id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (response.ok) {
                    // Remove the activity from the list
                    setActivities(prev => prev.filter(a => a.id !== activity.id));
                    
                    // If this was the selected activity, clear selection
                    if (selectedActivity && selectedActivity.id === activity.id) {
                        setSelectedActivity(null);
                        setOpenTabs([]);
                        setActiveTabId(null);
                        setEditorContent({});
                        setIsDirty(false);
                    }
                    
                    showNotification(`Activity "${activity.name}" deleted successfully`, 'success');
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to delete activity');
                }
            } catch (error) {
                console.error('Error deleting activity:', error);
                showNotification(`Failed to delete activity: ${error.message}`, 'error');
            }
        };

        const loadTabContent = async (activityId, type) => {
            const tabId = `${activityId}-${type}`;
            let content = getDefaultContent(activityId, type);
            
            console.log(`[DEBUG] loadTabContent called with activityId: "${activityId}", type: "${type}"`);
            
            try {
                // Use the enhanced-workflow-editor API on port 3001
                const apiUrl = `http://localhost:3001/api/activities/${activityId}`;
                console.log(`[DEBUG] Fetching from: ${apiUrl}`);
                
                const response = await fetch(apiUrl);
                console.log(`[DEBUG] Response status: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log(`[DEBUG] Response data structure:`, {
                        hasData: !!data.data,
                        dataType: Array.isArray(data.data) ? 'array' : typeof data.data,
                        dataLength: Array.isArray(data.data) ? data.data.length : 'n/a',
                        firstItemId: Array.isArray(data.data) && data.data[0] ? data.data[0].id : data.data?.id
                    });
                    
                    let activity = data.data;
                    
                    // Handle if data.data is an array (shouldn't happen for single activity)
                    if (Array.isArray(data.data)) {
                        console.warn(`[DEBUG] Got array response for single activity ${activityId}, finding matching activity`);
                        activity = data.data.find(a => a.id === activityId);
                        if (!activity) {
                            console.error(`[DEBUG] Activity ${activityId} not found in array response`);

                        }
                    }
                    
                    if (activity) {
                        console.log(`[DEBUG] Found activity: ${activity.id}, loading ${type} content`);
                        console.log(`[DEBUG] Activity has code:`, !!activity.code, activity.code ? activity.code.substring(0, 100) + '...' : 'no code');
                        
                        switch (type) {
                            case 'code':
                                content = activity.code || content;
                                console.log(`[DEBUG] Setting code content, length: ${content.length}`);
                                break;
                            case 'schema':
                                content = JSON.stringify({
                                    id: activity.id,
                                    name: activity.name,
                                    type: activity.type,
                                    inputs: activity.inputs || [],
                                    outputs: activity.outputs || [],
                                    description: activity.description
                                }, null, 2);
                                console.log(`[DEBUG] Generated schema content, length: ${content.length}`);
                                break;
